<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reisen">
<meta name="theme-color" content="#14532d">
<title>Reisen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="v-karte" class="view active">
    <div class="laender">
      <div class="seg" id="seg"><button data-s="besucht" class="on">Bereist</button><button data-s="gelebt">Gelebt</button><button data-s="wunsch">Wunsch</button></div>
      <div id="laender"></div>
    </div>
    <div class="map-wrap">
    <div id="map"></div>
    <div class="map-top">
      <button id="b-laenderwahl" class="wahl">🌍 Alle Länder ▾</button>
      <select id="f-status"><option value="">Alle Orte</option><option value="besucht">Besucht</option><option value="geplant">Geplant</option><option value="idee">Idee</option></select>
      <button id="b-hier" title="Mein Standort">◎</button>
    </div>
    <div id="trip-banner" hidden></div>
    <button class="fab" id="b-fotoimport" title="Fotos importieren">📷</button>
    <input type="file" id="in-fotos" accept="image/*" multiple hidden>
    </div>
    <ol class="leiste" id="leiste" aria-label="Alle Orte"></ol>
  </section>
  <section id="v-wunsch" class="view"><h1>Wunschliste</h1><div class="seg" id="wseg"><button data-w="alle" class="on">Alle</button><button data-w="offen">Noch nicht geplant</button><button data-w="geplant">Geplant</button></div><div id="wunsch-liste"></div></section>
  <section id="v-reisen" class="view"><h1>Reisen <button id="b-neue-reise" class="small">+ Neu</button></h1><div id="reise-liste"></div></section>
  <section id="v-mehr" class="view">
    <h1>Daten</h1>
    <div class="card" id="sync-karte"></div>
    <div class="card" style="margin-top:12px">
      <p id="stats"></p>
      <button id="b-export">Backup mit Fotos exportieren</button>
      <label class="btn">Backup / orte.json importieren<input type="file" id="in-import" accept=".json,application/json" hidden></label>
      <p class="hint">orte.json aus dem Obsidian-Vault (<code>python3 _tools/export_app.py</code>) wird zusammengeführt, bestehende Fotos/Reisen bleiben erhalten.</p>
    </div>
  </section>
</main>
<nav>
  <button data-v="karte" class="on">🗺️<span>Karte</span></button>
  <button data-v="wunsch">⭐<span>Wunsch</span></button>
  <button data-v="reisen">🧳<span>Reisen</span></button>
  <button data-v="mehr">⚙️<span>Daten</span></button>
</nav>
<div id="sheet" hidden><div class="sheet-inner" id="sheet-inner"></div></div>
<div id="viewer" hidden><img id="viewer-img" alt=""></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script src="laender.js"></script>
<script src="sync.js"></script>
</body>
</html>
